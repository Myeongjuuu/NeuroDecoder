[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurodecoder"
version = "0.1.0"
description = "Python workflows for inner-speech EEG analysis and decoding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "mne>=1.7",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
ica = ["mne-icalabel>=0.7", "onnxruntime>=1.17"]

[project.scripts]
neurodecoder = "neurodecoder.cli:main"

[tool.setuptools]
package-dir = {neurodecoder = "src"}
packages = ["neurodecoder", "neurodecoder.analysis", "neurodecoder.data", "neurodecoder.models"]
